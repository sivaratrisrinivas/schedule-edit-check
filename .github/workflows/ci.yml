name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run eval | tee eval.txt
      - name: Report is up to date
        run: git diff --exit-code -- docs/results.json
      - run: cat eval.txt >> "$GITHUB_STEP_SUMMARY"
